<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6b4f">
<meta name="description" content="Lições de gramática de português europeu para estudo autónomo.">
<title>Aprender Português — Índice de Lições</title>
<style>
  :root{
    --verde:#2f6b4f; --verde-claro:#e4efe7; --vermelho:#b03a3a;
    --azul-esc:#2b4a63; --areia:#f6f0e9; --texto:#22303a; --cinza:#77838b;
    --borda:#ddd3c8; --raio:14px; --toque:44px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--areia);color:var(--texto);
    font-size:clamp(15.5px,1vw + 13px,17px);line-height:1.65;
    overflow-x:hidden;
  }
  .wrap{
    width:100%;max-width:960px;margin:0 auto;
    padding:clamp(12px,3vw,24px) clamp(12px,4vw,20px) calc(50px + env(safe-area-inset-bottom));
  }

  /* ---------- cabeçalho ---------- */
  header.topo{
    background:linear-gradient(135deg,#2f6b4f,#3d8a66);color:#fff;
    border-radius:var(--raio);padding:clamp(22px,5vw,32px) clamp(18px,5vw,28px);
    margin-bottom:18px;
  }
  header.topo h1{margin:0 0 6px;font-size:clamp(1.5rem,5.5vw,2.1rem);line-height:1.2}
  header.topo p{margin:0;opacity:.93;font-size:clamp(.9rem,2.6vw,1rem)}
  .progresso{margin-top:18px;background:rgba(255,255,255,.22);border-radius:20px;height:10px;overflow:hidden}
  .progresso div{height:100%;background:#ffd97d;width:0;transition:width .4s}
  .progresso-txt{font-size:.85em;opacity:.92;margin-top:7px}

  /* ---------- filtros ---------- */
  .filtros{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
  @media (min-width:700px){.filtros{flex-direction:row;align-items:center}}
  #busca{
    width:100%;border:2px solid var(--borda);border-radius:24px;
    padding:0 18px;min-height:var(--toque);
    font-size:16px;font-family:inherit;background:#fff;
  }
  @media (min-width:700px){#busca{flex:1 1 auto;width:auto}}
  #busca:focus{outline:2px solid var(--verde);outline-offset:1px;border-color:var(--verde)}
  .niveis{
    display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .niveis::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;background:#fff;border:1px solid var(--borda);
    padding:0 16px;min-height:var(--toque);border-radius:22px;
    font-size:.86rem;font-weight:600;color:var(--azul-esc);
    cursor:pointer;font-family:inherit;
    display:flex;align-items:center;
  }
  .chip.ativo{background:var(--verde);color:#fff;border-color:var(--verde)}
  .chip:active{transform:scale(.97)}

  /* ---------- cartões ---------- */
  #lista{display:grid;grid-template-columns:1fr;gap:14px}
  @media (min-width:1000px){#lista{grid-template-columns:1fr 1fr}}

  .cartao{
    background:#fff;border-radius:var(--raio);
    padding:clamp(16px,4vw,20px);
    box-shadow:0 2px 10px rgba(0,0,0,.05);
    display:flex;flex-direction:column;gap:14px;
    transition:transform .15s,box-shadow .15s;
  }
  @media (min-width:560px) and (max-width:999px){
    .cartao{flex-direction:row;align-items:flex-start;gap:18px}
  }
  .cartao:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.09)}
  .cartao.feita{border-left:5px solid var(--verde)}
  .cartao.emfalta{opacity:.62;border-left:5px solid var(--vermelho)}

  .corpo{flex:1;min-width:0}
  .corpo h2{margin:0 0 6px;font-size:clamp(1.05rem,3.2vw,1.22rem);line-height:1.3}
  .corpo h2 a{color:var(--vermelho);text-decoration:none}
  .corpo h2 a:hover{text-decoration:underline}
  .meta{font-size:.8em;color:var(--cinza);margin-bottom:8px;line-height:2}
  .meta code{
    background:#f4f1ea;border-radius:5px;padding:2px 6px;
    font-size:.92em;word-break:break-all;
  }
  .badge{
    display:inline-block;background:var(--verde-claro);color:var(--verde);
    border-radius:12px;padding:2px 10px;font-size:.9em;font-weight:700;margin-right:6px;
  }
  .badge.tema{background:#e6edf3;color:var(--azul-esc)}
  .badge.erro{background:#fbeaea;color:var(--vermelho)}
  .desc{font-size:.94em;margin:0}

  .acoes{display:flex;gap:10px;flex:0 0 auto}
  @media (min-width:560px) and (max-width:999px){
    .acoes{flex-direction:column;width:auto}
  }
  a.btn,.marcar{
    flex:1;min-height:var(--toque);border-radius:22px;
    font-size:.9rem;font-weight:600;font-family:inherit;
    display:flex;align-items:center;justify-content:center;
    padding:0 18px;text-align:center;cursor:pointer;white-space:nowrap;
  }
  a.btn{background:var(--verde);color:#fff;text-decoration:none;border:2px solid var(--verde)}
  a.btn:hover{background:#255540;border-color:#255540}
  .marcar{background:#fff;border:2px solid var(--borda);color:var(--azul-esc);font-size:.84rem}
  .marcar.on{background:var(--verde-claro);border-color:var(--verde);color:var(--verde)}
  a.btn:active,.marcar:active{transform:scale(.98)}

  .vazio{
    grid-column:1/-1;background:#fff;border-radius:var(--raio);
    padding:34px 20px;text-align:center;color:var(--cinza);
  }
  footer{margin-top:26px;font-size:.84em;color:var(--cinza);text-align:center;line-height:1.7}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media print{.filtros,.acoes,.progresso{display:none}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap">

<header class="topo">
  <h1>Aprender Português</h1>
  <p>Lições de gramática para estudo autónomo · português europeu</p>
  <div class="progresso"><div id="barra"></div></div>
  <div class="progresso-txt" id="progressoTxt">—</div>
</header>

<div class="filtros">
  <input id="busca" type="search" placeholder="Procurar lição…" aria-label="Procurar lição">
  <div class="niveis">
    <button class="chip ativo" data-nivel="todos">Todos</button>
    <button class="chip" data-nivel="A1">A1</button>
    <button class="chip" data-nivel="A2">A2</button>
    <button class="chip" data-nivel="B1">B1</button>
    <button class="chip" data-nivel="B2">B2</button>
  </div>
</div>

<div id="lista"></div>

<footer>
  Marque cada lição como concluída para acompanhar o seu progresso.<br>
  O progresso fica guardado apenas neste dispositivo.
</footer>

</div>

<script>
/* ==========================================================================
   ADICIONAR UMA LIÇÃO NOVA  ·  ADDING A NEW LESSON
   --------------------------------------------------------------------------
   1. Faça upload do ficheiro .html para o repositório (mesma pasta do index).
   2. Copie um bloco { ... } abaixo e altere os campos.
   3. Guarde (commit). O site atualiza-se sozinho em cerca de um minuto.

   Só "ficheiro" e "titulo" são obrigatórios. Os restantes são opcionais.
   ========================================================================== */

const LICOES = [

  {
    ficheiro: "gramatica_b1_ser_estar.html",
    titulo:   "Ser ou Estar, Artigos, Pronomes e Ordem da Frase",
    nivel:    "B1",
    tema:     "Gramática",
    duracao:  "45–60 min",
    descricao:"Diferença entre SER e ESTAR, artigos definidos e indefinidos, contrações, pronomes pessoais e de complemento, ordem das palavras. Inclui exercícios com autocorreção e um texto de leitura."
  },

  /* ---- Exemplo: descomente e adapte quando criar a próxima lição ----
  {
    ficheiro: "pret_perfeito_imperfeito.html",
    titulo:   "Pretérito Perfeito vs. Imperfeito",
    nivel:    "B1",
    tema:     "Verbos",
    duracao:  "45 min",
    descricao:"Quando usar cada um dos passados, com exercícios e leitura."
  },
  ------------------------------------------------------------------- */

];

/* ====== A partir daqui não é preciso mexer ====== */

let filtroNivel = "todos", filtroTexto = "";

function lerFeitas(){
  try { return JSON.parse(localStorage.getItem("licoesFeitas") || "[]"); }
  catch(e){ return []; }
}
function guardarFeitas(lista){
  try { localStorage.setItem("licoesFeitas", JSON.stringify(lista)); } catch(e){}
}
function alternar(ficheiro){
  const feitas = lerFeitas();
  const i = feitas.indexOf(ficheiro);
  if(i === -1) feitas.push(ficheiro); else feitas.splice(i,1);
  guardarFeitas(feitas);
  desenhar();
}
function normalizar(s){
  return (s||"").toLowerCase().normalize("NFD")
    .replace(new RegExp("[\\u0300-\\u036f]","g"),"");
}
function escapar(s){
  return String(s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

function desenhar(){
  const feitas = lerFeitas();
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  const visiveis = LICOES.filter(l => {
    const nivelOk = filtroNivel === "todos" || (l.nivel || "") === filtroNivel;
    const alvo = normalizar([l.titulo,l.tema,l.nivel,l.descricao,l.ficheiro].join(" "));
    return nivelOk && (!filtroTexto || alvo.includes(normalizar(filtroTexto)));
  });

  if(visiveis.length === 0){
    lista.innerHTML = '<div class="vazio">Nenhuma lição corresponde à pesquisa.</div>';
  }

  visiveis.forEach(l => {
    const feita = feitas.includes(l.ficheiro);
    const cartao = document.createElement("div");
    cartao.className = "cartao" + (feita ? " feita" : "");
    cartao.innerHTML =
      '<div class="corpo">' +
        '<h2><a href="' + escapar(l.ficheiro) + '">' + escapar(l.titulo) + '</a></h2>' +
        '<div class="meta">' +
          (l.nivel ? '<span class="badge">' + escapar(l.nivel) + '</span>' : '') +
          (l.tema ? '<span class="badge tema">' + escapar(l.tema) + '</span>' : '') +
          (l.duracao ? escapar(l.duracao) + ' · ' : '') +
          '<code>' + escapar(l.ficheiro) + '</code>' +
          '<span class="aviso"></span>' +
        '</div>' +
        (l.descricao ? '<p class="desc">' + escapar(l.descricao) + '</p>' : '') +
      '</div>' +
      '<div class="acoes">' +
        '<a class="btn" href="' + escapar(l.ficheiro) + '">Abrir lição</a>' +
        '<button class="marcar' + (feita ? ' on' : '') + '">' +
          (feita ? '✔ Concluída' : 'Marcar concluída') + '</button>' +
      '</div>';
    cartao.querySelector(".marcar").addEventListener("click", () => alternar(l.ficheiro));
    lista.appendChild(cartao);
    verificarFicheiro(l.ficheiro, cartao);
  });

  const nFeitas = LICOES.filter(l => feitas.includes(l.ficheiro)).length;
  const pct = LICOES.length ? Math.round(nFeitas / LICOES.length * 100) : 0;
  document.getElementById("barra").style.width = pct + "%";
  document.getElementById("progressoTxt").textContent =
    nFeitas + " de " + LICOES.length + " " +
    (LICOES.length === 1 ? "lição concluída" : "lições concluídas") + " (" + pct + "%)";
}

/* Avisa se o nome do ficheiro estiver errado (só funciona com o site online) */
function verificarFicheiro(ficheiro, cartao){
  if(location.protocol === "file:") return;
  fetch(ficheiro, {method:"HEAD"}).then(r => {
    if(!r.ok){
      cartao.classList.add("emfalta");
      cartao.querySelector(".aviso").innerHTML =
        ' <span class="badge erro">ficheiro não encontrado</span>';
    }
  }).catch(() => {});
}

document.getElementById("busca").addEventListener("input", e => {
  filtroTexto = e.target.value; desenhar();
});
document.querySelectorAll(".chip").forEach(c => {
  c.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(x => x.classList.remove("ativo"));
    c.classList.add("ativo");
    filtroNivel = c.dataset.nivel;
    desenhar();
  });
});

desenhar();
</script>
</body>
</html>
